<body><div class="game-wrap"><div class="game-top archive-header"><div class="archive-head"><nav class="archive-nav" aria-label="게임 아카이브"><span class="archive-kicker">GAME ARCHIVE</span><a class="archive-link active" href="games.html">보드게임 책장 <span>📚</span></a><span class="archive-divider">|</span><a class="archive-link" href="play-log.html">플레이 로그 <span>📅</span></a><span class="archive-divider">|</span><a class="archive-link" href="rules-notes.html">잔룰 노트 <span>📝</span></a><span class="archive-divider">|</span><a class="archive-link" href="pandemic-legacy-s1.html">팬데믹 S1 로그 <span>🔒</span></a><span class="archive-divider">|</span><a class="archive-link" href="pandemic-legacy-s2.html">팬데믹 S2 로그 <span>🔒</span></a></nav></div><a class="back" href="index.html">← HOME</a></div>
<div class="game-toolbar"><input id="q" placeholder="게임명 검색"><select id="genreFilter"><option value="">장르 전체</option><option>전략</option><option>파티/패밀리</option><option>추리</option><option>마피아/디덕션</option><option>협력</option></select><label class="expansion-toggle" title="체크를 끄면 확장 게임을 숨깁니다"><input id="showExpansions" type="checkbox" checked> 확장 포함</label><button class="add-toggle" id="addToggle" style="display:none">+ 게임 추가</button></div>
<div class="add-box" id="addBox"><h2 id="formTitle">새 게임 추가</h2><form id="gameForm" class="game-form"><input id="gameName" required placeholder="게임명"><input id="gamePeople" placeholder="인원 (예: 2–4인)"><input id="gameTime" placeholder="시간 (예: 60–90분)"><select id="gameGenre" required><option value="">세부장르 선택</option><option>전략</option><option>파티/패밀리</option><option>추리</option><option>마피아/디덕션</option><option>협력</option></select><input class="image-field" id="gameImage" type="file" accept="image/*"><div class="game-flags"><label class="flag-check"><input id="gameExpansion" type="checkbox"> 확장 게임</label><label class="flag-check"><input id="gameFunding" type="checkbox"> 펀딩 게임</label></div><div class="form-actions"><button type="button" class="cancel-edit" id="cancelEdit">취소</button><button class="submit-game" id="submitGame">책장에 추가</button></div></form><p class="image-note" id="imageNote">새 이미지를 선택하지 않으면 기존 이미지가 그대로 유지돼요.</p></div>
<div class="result-count" id="resultCount"></div><div class="gamegrid" id="list"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://yqvjgalmjrydfygtozgo.supabase.co','sb_publishable_8K_sITH95Nkikw8-tdyDwQ_-JFzo94Z');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const koCollator=new Intl.Collator('ko-KR',{numeric:true,sensitivity:'base'});
let games=[],isAdmin=false,editingId=null;
const GAME_CACHE_KEY='jei_board_games_cache_v2';
function writeGameCache(){try{localStorage.setItem(GAME_CACHE_KEY,JSON.stringify(games))}catch(e){}}
function readGameCache(){try{const x=JSON.parse(localStorage.getItem(GAME_CACHE_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}

function sortGames(list){return [...list].sort((a,b)=>koCollator.compare((a.name||'').trim(),(b.name||'').trim()));}

async function init(){
  const cached=readGameCache();
  if(cached.length){games=cached;draw();}
  const {data:{session}}=await db.auth.getSession();
  isAdmin=!!session;
  $('#addToggle').style.display=isAdmin?'':'none';
  const {data,error}=await db.from('board_games').select('*');
  if(error)return alert(error.message);
  games=(data||[]).map(g=>({id:g.id,name:g.title,people:g.player_count,time:g.play_time,genre:g.genre,expansion:g.is_expansion,funding:g.is_funding,image:g.image_url}));
  writeGameCache();
  draw();
}

function draw(){
  const q=$('#q').value.trim().toLowerCase(),genre=$('#genreFilter').value;
  const showExpansions=$('#showExpansions').checked;
  const arr=sortGames(games.filter(g=>(!q||g.name.toLowerCase().includes(q))&&(!genre||g.genre===genre)&&(showExpansions||!g.expansion)));
  const hiddenExpansionCount=!showExpansions?games.filter(g=>g.expansion&&(!q||g.name.toLowerCase().includes(q))&&(!genre||g.genre===genre)).length:0;
  $('#resultCount').textContent=`총 ${arr.length}개 · 가나다순${hiddenExpansionCount?` · 확장 ${hiddenExpansionCount}개 숨김`:''}`;
  $('#list').innerHTML=arr.length?arr.map(g=>`<article class="game-card">${isAdmin?`<div class="game-actions"><button class="edit-game" onclick="editGame('${g.id}')">수정</button><button class="delete-game" onclick="delGame('${g.id}')">×</button></div>`:''}<div class="game-image">${g.image?`<img src="${g.image}" alt="${esc(g.name)}" loading="lazy" decoding="async">`:'<span class="no-image">NO IMAGE</span>'}</div><div class="game-info"><div class="game-info-top"><span class="game-genre">${esc(g.genre)}</span>${(g.expansion||g.funding)?`<div class="game-badges">${g.expansion?'<span class="game-badge expansion-badge">확장</span>':''}${g.funding?'<span class="game-badge funding-badge">펀딩</span>':''}</div>`:''}</div><h3 title="${esc(g.name)}">${esc(g.name)}</h3><div class="game-meta">👥 ${esc(g.people||'-')}<br>⏱ ${esc(g.time||'-')}</div></div></article>`).join(''):'<div class="empty-games">등록된 게임이 없어요.</div>';
}

function openAdd(){
  editingId=null;
  $('#gameForm').reset();
  $('#addBox').classList.add('show');
  $('#addBox').classList.remove('editing');
  $('#formTitle').textContent='새 게임 추가';
  $('#submitGame').textContent='책장에 추가';
  $('#imageNote').textContent='이미지는 Supabase Storage에 저장돼요.';
  $('#gameName').focus();
}
function closeForm(){
  editingId=null;
  $('#gameForm').reset();
  $('#addBox').classList.remove('show','editing');
  $('#formTitle').textContent='새 게임 추가';
  $('#submitGame').textContent='책장에 추가';
}

$('#q').oninput=draw;
$('#genreFilter').onchange=draw;
const savedExpansionView=localStorage.getItem('jei_show_expansions');
if(savedExpansionView==='false')$('#showExpansions').checked=false;
$('#showExpansions').onchange=()=>{localStorage.setItem('jei_show_expansions',$('#showExpansions').checked?'true':'false');draw();};
$('#addToggle').onclick=()=>{if($('#addBox').classList.contains('show'))closeForm();else openAdd();};
$('#cancelEdit').onclick=closeForm;

window.editGame=id=>{
  if(!isAdmin)return;
  const g=games.find(x=>x.id===id);
  if(!g)return;
  editingId=id;
  $('#gameName').value=g.name||'';
  $('#gamePeople').value=g.people||'';
  $('#gameTime').value=g.time||'';
  $('#gameGenre').value=g.genre||'';
  $('#gameExpansion').checked=!!g.expansion;
  $('#gameFunding').checked=!!g.funding;
  $('#gameImage').value='';
  $('#addBox').classList.add('show','editing');
  $('#formTitle').textContent='게임 수정';
  $('#submitGame').textContent='수정 저장';
  $('#imageNote').textContent=g.image?'새 이미지를 선택하지 않으면 기존 이미지가 그대로 유지돼요.':'현재 등록된 이미지가 없어요. 필요하면 새 이미지를 선택하세요.';
  $('#addBox').scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>$('#gameName').focus(),250);
};

window.delGame=async id=>{
  if(!isAdmin||!confirm('이 게임을 책장에서 삭제할까요?'))return;
  const {error}=await db.from('board_games').delete().eq('id',id);
  if(error)return alert(error.message);
  games=games.filter(g=>g.id!==id);
  writeGameCache();
  if(editingId===id)closeForm();
  draw();
};

async function uploadImage(file){
  if(!file)return null;
  const path=`${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const up=await db.storage.from('board-game-images').upload(path,file);
  if(up.error)throw up.error;
  return db.storage.from('board-game-images').getPublicUrl(path).data.publicUrl;
}

$('#gameForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!isAdmin)return;
  const name=$('#gameName').value.trim();
  if(!name)return;
  const file=$('#gameImage').files[0];
  let newImage=null;
  try{newImage=await uploadImage(file);}catch(err){return alert(err.message);}
  const row={
    title:name,
    player_count:$('#gamePeople').value.trim(),
    play_time:$('#gameTime').value.trim(),
    genre:$('#gameGenre').value,
    is_expansion:$('#gameExpansion').checked,
    is_funding:$('#gameFunding').checked
  };
  if(newImage)row.image_url=newImage;

  if(editingId){
    const {data,error}=await db.from('board_games').update(row).eq('id',editingId).select().single();
    if(error)return alert(error.message);
    const idx=games.findIndex(g=>g.id===editingId);
    if(idx>-1)games[idx]={id:data.id,name:data.title,people:data.player_count,time:data.play_time,genre:data.genre,expansion:data.is_expansion,funding:data.is_funding,image:data.image_url};
  }else{
    if(!newImage)row.image_url='';
    const {data,error}=await db.from('board_games').insert(row).select().single();
    if(error)return alert(error.message);
    games.push({id:data.id,name:data.title,people:data.player_count,time:data.play_time,genre:data.genre,expansion:data.is_expansion,funding:data.is_funding,image:data.image_url});
  }
  writeGameCache();
  closeForm();
  draw();
});


init();
</script></body></html>
