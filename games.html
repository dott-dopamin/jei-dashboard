<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEI | 보드게임 책장</title><link rel="stylesheet" href="style.css">
<style>
.game-wrap{max-width:1560px;margin:auto;padding:42px 26px 70px}.game-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #dde1e6;padding-bottom:20px}.game-top h1{font-size:38px;margin:7px 0 0}.back{text-decoration:none;color:#666;font-size:13px}.game-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 160px auto;gap:8px;margin:20px 0}.game-toolbar input,.game-toolbar select,.game-form input,.game-form select{border:1px solid #dfe2e6;border-radius:9px;background:#fff;padding:12px 13px;font:14px inherit;outline:none}.game-toolbar button,.game-form button,.add-toggle{border:0;border-radius:9px;background:#17191c;color:#fff;font-weight:700;padding:0 18px;cursor:pointer}.add-box{display:none;background:#fff;border:1px solid #e1e4e8;border-radius:16px;padding:20px;margin-bottom:20px}.add-box.show{display:block}.add-box h2{font-size:18px;margin:0 0 15px}.game-form{display:grid;grid-template-columns:1.4fr .8fr .8fr .9fr;gap:9px}.game-form .image-field{grid-column:1/3}.game-form .expansion-check{display:flex;align-items:center;gap:8px;padding:0 5px;font-size:14px}.game-form .expansion-check input{width:17px;height:17px}.game-form .submit-game{grid-column:4;height:43px}.image-note{font-size:11px;color:#9298a1;margin:8px 0 0}.gamegrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:11px}.game-card{position:relative;background:#fff;border:1px solid #e1e4e8;border-radius:14px;overflow:hidden;min-width:0}.game-image{aspect-ratio:1/1;background:#eef0f3;display:grid;place-items:center;overflow:hidden}.game-image img{width:100%;height:100%;object-fit:cover}.no-image{font-size:12px;color:#a1a6ad}.game-info{padding:13px}.game-genre{font-size:10px;letter-spacing:.08em;color:#8d939c;font-weight:800}.game-card h3{font-size:16px;margin:6px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.game-meta{font-size:12px;color:#737983;line-height:1.7}.expansion-badge{position:absolute;top:9px;left:9px;background:#17191c;color:#fff;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:800;z-index:2}.delete-game{position:absolute;right:8px;top:8px;width:27px;height:27px;border:0;border-radius:50%;background:#fffddd;color:#666;cursor:pointer;font-size:16px;z-index:2}.empty-games{grid-column:1/-1;text-align:center;color:#9aa0a8;padding:70px 0}.result-count{font-size:12px;color:#8c929a;margin:-8px 0 14px}
@media(max-width:1350px){.gamegrid{grid-template-columns:repeat(6,1fr)}}@media(max-width:1100px){.gamegrid{grid-template-columns:repeat(5,1fr)}}@media(max-width:820px){.gamegrid{grid-template-columns:repeat(3,1fr)}.game-form{grid-template-columns:1fr 1fr}.game-form .image-field,.game-form .submit-game{grid-column:auto}.game-form .submit-game{height:43px}}@media(max-width:600px){.game-wrap{padding:28px 10px 50px}.game-top{align-items:flex-start}.game-top h1{font-size:31px}.game-toolbar{grid-template-columns:1fr 110px}.game-toolbar .add-toggle{grid-column:1/-1;height:42px}.gamegrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.game-form{grid-template-columns:1fr}.game-form .image-field,.game-form .submit-game{grid-column:auto}.game-card{border-radius:10px}.game-image{aspect-ratio:1/0.82}.game-info{padding:7px}.game-genre{font-size:8px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.game-card h3{font-size:12px;margin:4px 0 5px}.game-meta{font-size:10px;line-height:1.45}.expansion-badge{top:5px;left:5px;padding:3px 5px;font-size:8px}.delete-game{right:4px;top:4px;width:22px;height:22px;font-size:13px}.no-image{font-size:9px}}
</style></head>
<body><div class="game-wrap"><div class="game-top"><div><span class="eyebrow">JEI'S COLLECTION</span><h1>보드게임 책장</h1></div><a class="back" href="index.html">← HOME</a></div>
<div class="game-toolbar"><input id="q" placeholder="게임명 검색"><select id="genreFilter"><option value="">장르 전체</option><option>전략</option><option>파티/패밀리</option><option>추리</option></select><button class="add-toggle" id="addToggle">+ 게임 추가</button></div>
<div class="add-box" id="addBox"><h2>새 게임 추가</h2><form id="gameForm" class="game-form"><input id="gameName" required placeholder="게임명"><input id="gamePeople" placeholder="인원 (예: 2–4인)"><input id="gameTime" placeholder="시간 (예: 60–90분)"><select id="gameGenre" required><option value="">세부장르 선택</option><option>전략</option><option>파티/패밀리</option><option>추리</option></select><input class="image-field" id="gameImage" type="file" accept="image/*"><label class="expansion-check"><input id="gameExpansion" type="checkbox"> 확장 게임</label><button class="submit-game">책장에 추가</button></form><p class="image-note">이미지는 브라우저 저장공간을 아끼도록 자동 축소해서 저장돼요.</p></div>
<div class="result-count" id="resultCount"></div><div class="gamegrid" id="list"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://yqvjgalmjrydfygtozgo.supabase.co','sb_publishable_8K_sITH95Nkikw8-tdyDwQ_-JFzo94Z');const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let games=[],isAdmin=false;
async function init(){const {data:{session}}=await db.auth.getSession();isAdmin=!!session;$('#addToggle').style.display=isAdmin?'':'none';const {data,error}=await db.from('board_games').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);games=(data||[]).map(g=>({id:g.id,name:g.title,people:g.player_count,time:g.play_time,genre:g.genre,expansion:g.is_expansion,image:g.image_url}));draw()}
function draw(){const q=$('#q').value.trim().toLowerCase(),genre=$('#genreFilter').value;const arr=games.filter(g=>(!q||g.name.toLowerCase().includes(q))&&(!genre||g.genre===genre));$('#resultCount').textContent=`총 ${arr.length}개`;$('#list').innerHTML=arr.length?arr.map(g=>`<article class="game-card">${g.expansion?'<span class="expansion-badge">확장</span>':''}${isAdmin?`<button class="delete-game" onclick="delGame('${g.id}')">×</button>`:''}<div class="game-image">${g.image?`<img src="${g.image}" alt="${esc(g.name)}">`:'<span class="no-image">NO IMAGE</span>'}</div><div class="game-info"><span class="game-genre">${esc(g.genre)}</span><h3>${esc(g.name)}</h3><div class="game-meta">👥 ${esc(g.people||'-')}<br>⏱ ${esc(g.time||'-')}</div></div></article>`).join(''):'<div class="empty-games">등록된 게임이 없어요.</div>'}
$('#q').oninput=draw;$('#genreFilter').onchange=draw;$('#addToggle').onclick=()=>$('#addBox').classList.toggle('show');window.delGame=async id=>{if(!isAdmin||!confirm('이 게임을 책장에서 삭제할까요?'))return;const {error}=await db.from('board_games').delete().eq('id',id);if(error)return alert(error.message);games=games.filter(g=>g.id!==id);draw()};
$('#gameForm').addEventListener('submit',async e=>{e.preventDefault();if(!isAdmin)return;const name=$('#gameName').value.trim(),file=$('#gameImage').files[0];if(!name)return;let image_url='';if(file){const path=`${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await db.storage.from('board-game-images').upload(path,file);if(up.error)return alert(up.error.message);image_url=db.storage.from('board-game-images').getPublicUrl(path).data.publicUrl}const row={title:name,player_count:$('#gamePeople').value.trim(),play_time:$('#gameTime').value.trim(),genre:$('#gameGenre').value,is_expansion:$('#gameExpansion').checked,image_url};const {data,error}=await db.from('board_games').insert(row).select().single();if(error)return alert(error.message);games.unshift({id:data.id,name:data.title,people:data.player_count,time:data.play_time,genre:data.genre,expansion:data.is_expansion,image:data.image_url});e.target.reset();$('#addBox').classList.remove('show');draw()});init();
</script></body></html>
