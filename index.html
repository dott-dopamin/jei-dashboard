<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEI Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body><div class="lock-screen" id="lockScreen"><div class="lock-box"><small>PRIVATE DASHBOARD</small><h2>일해라 절해라</h2><p>개인 대시보드입니다. 비밀번호를 입력하세요.</p><form class="lock-form" id="lockForm"><input id="lockPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" maxlength="20"><button type="submit">열기</button></form><p class="lock-error" id="lockError"></p></div></div><div class="wrap"><header><div><span class="eyebrow">PERSONAL DASHBOARD</span><h1>일해라 절해라</h1><p>업무 일정과 할 일을 한 화면에서.</p></div><div class="date" id="today"></div></header>
<nav class="quick"><a href="games.html">🎲 보드게임 책장 <span>외부 공유용 →</span></a></nav>
<main class="dashboard">
<section class="panel calendar-panel"><div class="section-head"><div><small>SCHEDULE</small><h2>업무 캘린더</h2></div><div class="month-nav"><button id="prev">‹</button><b id="monthTitle"></b><button id="next">›</button></div></div><div class="calendar-rules"><div class="calendar-rules-head"><b>키워드 색상</b><span>일정에 키워드가 포함되면 자동 적용</span></div><form id="ruleForm" class="rule-add"><input id="ruleKeyword" placeholder="예: 회의"><input id="ruleColor" type="color" value="#e8ddff"><button>등록</button></form><div id="ruleList" class="rules"></div></div><div class="week"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div><div id="calendar" class="calendar"></div><div class="cal-help">날짜를 클릭하면 일정을 추가할 수 있어요.</div></section>
<section class="panel todo-panel"><div class="section-head"><div><small>MY TASKS</small><h2>TODO</h2></div><div class="todo-head-actions"><button type="button" class="discontinue-open" id="discontinueOpen">☑ 단종 예정</button><span class="count" id="todoCount"></span></div></div><form id="todoForm" class="add-row"><input id="todoInput" autocomplete="off" placeholder="할 일을 입력하세요"><select id="todoStatus"><option value="before">시작 전</option><option value="doing">진행 중</option><option value="done">완료</option></select><button>추가</button></form><div class="todo-columns"><div class="todo-col"><h3><i class="dot before"></i>시작 전 <em id="beforeN">0</em></h3><div id="beforeList" class="todo-list"></div></div><div class="todo-col"><h3><i class="dot doing"></i>진행 중 <em id="doingN">0</em></h3><div id="doingList" class="todo-list"></div></div><div class="todo-col"><h3><i class="dot done"></i>완료 <em id="doneN">0</em></h3><div id="doneList" class="todo-list"></div></div></div></section>
<section class="panel memo-panel"><div class="section-head"><div><small>QUICK NOTE</small><h2>메모</h2></div><span id="memoSaved">자동 저장</span></div><textarea id="memo" placeholder="잊기 전에 적어두기..."></textarea></section>

</main></div>

<div class="modal" id="discontinueModal"><div class="modal-box discontinue-box"><div class="modal-head"><div><small>PRODUCT WATCH</small><h2>단종 예정리스트</h2></div><button type="button" class="x" id="discontinueClose">×</button></div><form id="discontinueForm" class="discontinue-form"><input id="discontinueProduct" placeholder="상품명을 입력하세요" autocomplete="off"><input id="discontinueMemo" placeholder="메모를 입력하세요 (선택)" autocomplete="off"><button>추가</button></form><div id="discontinueList" class="discontinue-list"></div></div></div>
<div class="modal" id="eventModal"><div class="modal-box"><div class="modal-head"><div><small>SCHEDULE</small><h2 id="modalDate"></h2></div><button type="button" class="x" id="closeModal">×</button></div><form id="eventForm" class="event-form"><input id="eventText" placeholder="일정 내용을 입력하세요" autocomplete="off"><button>일정 추가</button></form><div id="eventList" class="event-list"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script></body></html>
