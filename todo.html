<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TODO</title><link rel="stylesheet" href="style.css"><style>.todo{max-width:650px}.add{display:flex;gap:8px;margin:25px 0}.add input{flex:1;padding:14px;border:1px solid #ddd;border-radius:10px}.add button{border:0;border-radius:10px;padding:0 18px;background:#17191c;color:#fff}.item{background:#fff;border:1px solid #e3e5e9;border-radius:12px;padding:15px;margin:8px 0;display:flex;gap:12px}.done{text-decoration:line-through;color:#aaa}</style></head><body><div class="wrap todo"><a href="index.html" style="text-decoration:none;color:#777">← HOME</a><h1 style="font-size:36px">TODO</h1><div class="add"><input id="new" placeholder="할 일 입력"><button onclick="add()">추가</button></div><div id="items"></div></div><script>let a=JSON.parse(localStorage.todo||'[]');function save(){localStorage.todo=JSON.stringify(a);draw()}function add(){let v=new.value.trim();if(v){a.push({t:v,d:false});new.value='';save()}}function draw(){items.innerHTML=a.map((x,i)=>`<div class="item"><input type="checkbox" ${x.d?'checked':''} onchange="a[${i}].d=!a[${i}].d;save()"><span class="${x.d?'done':''}" style="flex:1">${x.t}</span><span onclick="a.splice(${i},1);save()" style="cursor:pointer">×</span></div>`).join('')}draw()</script></body></html>
