</head><body><div class="rules-wrap"><div class="rules-top archive-header"><nav class="archive-nav" aria-label="게임 아카이브"><span class="archive-kicker">GAME ARCHIVE</span><a class="archive-link" href="games.html">보드게임 책장 <span>📚</span></a><span class="archive-divider">|</span><a class="archive-link active" href="rules-notes.html">잔룰 노트 <span>📝</span></a><span class="archive-divider">|</span><a class="archive-link" href="pandemic-legacy-s1.html">팬데믹 S1 로그 <span>🔒</span></a></nav><a class="back" href="index.html">← HOME</a></div><div class="toolbar"><input id="q" placeholder="게임명 검색"><select id="genre"><option value="">장르 전체</option><option>전략</option><option>파티/패밀리</option><option>추리</option><option>마피아/디덕션</option><option>협력</option></select><label class="only-toggle"><input id="onlyWritten" type="checkbox"> 작성된 잔룰만</label></div><div id="summary" class="summary"></div><div id="list" class="rules-list"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://yqvjgalmjrydfygtozgo.supabase.co','sb_publishable_8K_sITH95Nkikw8-tdyDwQ_-JFzo94Z');const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const coll=new Intl.Collator('ko-KR',{numeric:true,sensitivity:'base'});let games=[],notes={},isAdmin=false,timers={};
async function init(){const {data:{session}}=await db.auth.getSession();isAdmin=!!session;const [{data:g,error:ge},{data:n,error:ne}]=await Promise.all([db.from('board_games').select('*'),db.from('board_game_rule_notes').select('*')]);if(ge)return alert(ge.message);games=(g||[]).sort((a,b)=>coll.compare(a.title,b.title));if(!ne)notes=Object.fromEntries((n||[]).map(x=>[x.game_id,x.note||'']));draw();}
function draw(){const q=$('#q').value.trim().toLowerCase(),genre=$('#genre').value,only=$('#onlyWritten').checked;const arr=games.filter(g=>(!q||g.title.toLowerCase().includes(q))&&(!genre||g.genre===genre)&&(!only||(notes[g.id]||'').trim()));$('#summary').textContent=`총 ${arr.length}개 · ${Object.values(notes).filter(x=>x.trim()).length}개 작성됨${isAdmin?' · 관리자 자동저장':' · 읽기 전용'}`;$('#list').innerHTML=arr.length?arr.map(g=>{const note=notes[g.id]||'';return `<article class="rule-card" data-id="${g.id}"><div class="rule-head" onclick="toggleCard('${g.id}')"><div style="min-width:0"><div class="rule-title">${esc(g.title)}</div><div class="rule-genre">${esc(g.genre||'')}</div></div><span class="rule-status ${note.trim()?'has':''}">${note.trim()?'잔룰 있음':'미작성'}</span></div><div class="rule-preview">${note.trim()?esc(note):'아직 잔룰 메모가 없어요.'}</div>${isAdmin?`<div id="ed-${g.id}" class="editor hidden"><textarea data-id="${g.id}" placeholder="룰북 전체 말고, 자꾸 헷갈리는 잔룰·예외·점수 계산·순서만 적어두기">${esc(note)}</textarea><div id="st-${g.id}" class="save-state">입력하면 자동 저장</div></div>`:''}</article>`}).join(''):'<div class="empty">조건에 맞는 게임이 없어요.</div>';if(isAdmin){document.querySelectorAll('.editor textarea').forEach(t=>t.oninput=()=>queueSave(t.dataset.id,t.value));}}
window.toggleCard=id=>{if(!isAdmin)return;const el=$('#ed-'+id);if(el)el.classList.toggle('hidden');};function queueSave(id,note){notes[id]=note;const st=$('#st-'+id);if(st)st.textContent='입력 중...';clearTimeout(timers[id]);timers[id]=setTimeout(()=>save(id,note),650);}async function save(id,note){const st=$('#st-'+id);if(st)st.textContent='저장 중...';const {error}=await db.from('board_game_rule_notes').upsert({game_id:id,note,updated_at:new Date().toISOString()},{onConflict:'game_id'});if(error){if(st)st.textContent='저장 실패';return console.error(error);}if(st)st.textContent='자동 저장됨';setTimeout(()=>{const x=$('#st-'+id);if(x&&x.textContent==='자동 저장됨')x.textContent='입력하면 자동 저장';},900);}
$('#q').oninput=draw;$('#genre').onchange=draw;$('#onlyWritten').onchange=draw;init();
</script></body></html>
