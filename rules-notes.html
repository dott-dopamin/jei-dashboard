<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEI | 잔룰 노트</title>
<link rel="preconnect" href="https://yqvjgalmjrydfygtozgo.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="prefetch" href="games.html">
<link rel="prefetch" href="pandemic-legacy-s1.html">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="archive-header.css">
<style>
html,body{background:#f7f8f9!important}
html{overflow-y:scroll;scrollbar-gutter:stable}
*{box-sizing:border-box}
button,input,textarea{font:inherit}
.rules-wrap{width:100%;max-width:1560px;margin:0 auto;padding:42px 26px 70px}
.rules-top{width:100%}
.back{text-decoration:none;color:#747c86;font-size:13px;font-weight:700}
.rules-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:9px;margin:20px 0 12px}
.rules-toolbar input{border:1px solid #dfe2e6;border-radius:10px;background:#fff;padding:12px 13px;font-size:14px;outline:none;color:#252b31}
.rules-toolbar input:focus{border-color:#b9c1c9;box-shadow:0 0 0 3px rgba(77,92,107,.07)}
.add-rule{border:0;border-radius:10px;background:#28343e;color:#fff;font-weight:800;padding:0 18px;cursor:pointer;white-space:nowrap}
.add-rule:hover{background:#1f2a32}
.summary{font-size:12px;color:#8c929a;margin:0 0 14px}
.rules-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rule-item{position:relative;background:#fff;border:1px solid #e1e4e8;border-radius:14px;min-width:0;overflow:hidden;transition:.15s ease}
.rule-item:hover{border-color:#cfd5db;box-shadow:0 5px 16px rgba(28,36,43,.05)}
.rule-open{width:100%;border:0;background:transparent;text-align:left;padding:15px 50px 15px 15px;cursor:pointer;color:#20252a}
.rule-name{font-size:15px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-hint{margin-top:5px;font-size:11px;color:#9aa0a7}
.rule-actions{position:absolute;right:9px;top:9px;display:flex;gap:4px}
.rule-edit,.rule-delete{height:28px;border:1px solid #e1e5e9;background:#fff;color:#6a727b;border-radius:14px;font-size:10px;font-weight:800;cursor:pointer}
.rule-edit{padding:0 9px}.rule-delete{width:28px;padding:0;font-size:14px}
.rule-edit:hover,.rule-delete:hover{background:#f2f4f6;color:#20252a}
.empty{grid-column:1/-1;text-align:center;color:#9aa0a8;padding:80px 0;font-size:13px}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(24,30,35,.46);display:grid;place-items:center;padding:18px}
.modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border:1px solid #dfe4e8;border-radius:18px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.modal-kicker{font-size:10px;letter-spacing:.14em;font-weight:900;color:#9198a0;margin-bottom:5px}
.modal h2{font-size:22px;margin:0;letter-spacing:-.03em}
.close-modal{border:0;width:34px;height:34px;border-radius:50%;background:#f0f2f4;color:#23282d;font-size:20px;cursor:pointer;flex:0 0 auto}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}.field label{font-size:11px;font-weight:800;color:#737c85}.field input,.field textarea{border:1px solid #dfe4e8;border-radius:10px;padding:11px 12px;background:#fff;outline:none;color:#20262b}.field input:focus,.field textarea:focus{border-color:#b8c0c8;box-shadow:0 0 0 3px rgba(77,92,107,.07)}.field textarea{min-height:220px;resize:vertical;line-height:1.65}
.note-view{white-space:pre-wrap;line-height:1.7;font-size:14px;color:#343b42;background:#f7f8f9;border:1px solid #e7eaed;border-radius:11px;padding:14px;min-height:150px}
.modal-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:15px}.primary{border:0;border-radius:9px;background:#28343e;color:#fff;font-weight:800;padding:10px 15px;cursor:pointer}.ghost{border:1px solid #dce1e5;border-radius:9px;background:#fff;color:#626a73;font-weight:800;padding:9px 13px;cursor:pointer}.save-state{font-size:11px;color:#8b9299;margin-right:auto}.hidden{display:none!important}
@media(max-width:1000px){.rules-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.rules-wrap{padding:28px 10px 50px}.rules-toolbar{grid-template-columns:1fr auto}.add-rule{padding:0 13px}.rules-list{grid-template-columns:1fr}.modal{padding:16px;border-radius:15px}.field textarea{min-height:180px}}
</style>
</head>
<body>
<div class="rules-wrap">
  <div class="rules-top archive-header">
    <nav class="archive-nav" aria-label="게임 아카이브">
      <span class="archive-kicker">GAME ARCHIVE</span>
      <a class="archive-link" href="games.html">보드게임 책장 <span>📚</span></a>
      <span class="archive-divider">|</span>
      <a class="archive-link active" href="rules-notes.html">잔룰 노트 <span>📝</span></a>
      <span class="archive-divider">|</span>
      <a class="archive-link" href="pandemic-legacy-s1.html">팬데믹 S1 로그 <span>🔒</span></a>
    </nav>
    <a class="back" href="index.html">← HOME</a>
  </div>

  <div class="rules-toolbar">
    <input id="q" placeholder="등록한 잔룰 검색">
    <button id="addRule" class="add-rule" type="button">+ 잔룰 추가</button>
  </div>
  <div id="summary" class="summary"></div>
  <div id="list" class="rules-list"></div>
</div>

<div id="ruleModal" class="modal-bg hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div><div class="modal-kicker">RULE NOTE</div><h2 id="modalTitle">잔룰 노트</h2></div>
      <button id="closeModal" class="close-modal" type="button" aria-label="닫기">×</button>
    </div>
    <div id="viewMode" class="hidden">
      <div id="viewNote" class="note-view"></div>
    </div>
    <form id="editMode" class="hidden">
      <input id="noteId" type="hidden">
      <div class="field"><label>게임명</label><input id="gameName" required placeholder="게임명"></div>
      <div class="field"><label>잔룰 메모</label><textarea id="gameNote" placeholder="헷갈리는 잔룰, 예외, 점수 계산, 턴 순서 등을 적어두세요."></textarea></div>
      <div class="modal-actions"><span id="saveState" class="save-state"></span><button id="cancelEdit" class="ghost" type="button">취소</button><button id="saveNew" class="primary" type="submit">저장</button></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://yqvjgalmjrydfygtozgo.supabase.co','sb_publishable_8K_sITH95Nkikw8-tdyDwQ_-JFzo94Z');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coll=new Intl.Collator('ko-KR',{numeric:true,sensitivity:'base'});
let notes=[],isAdmin=false,editingId=null,saveTimer=null;

async function init(){
  const {data:{session}}=await db.auth.getSession();
  isAdmin=!!session;
  $('#addRule').style.display=isAdmin?'':'none';
  const {data,error}=await db.from('game_rule_notes').select('*').order('game_name',{ascending:true});
  if(error)return alert(error.message);
  notes=(data||[]).sort((a,b)=>coll.compare(a.game_name||'',b.game_name||''));
  draw();
}

function draw(){
  const q=$('#q').value.trim().toLowerCase();
  const arr=notes.filter(n=>!q||(n.game_name||'').toLowerCase().includes(q)).sort((a,b)=>coll.compare(a.game_name||'',b.game_name||''));
  $('#summary').textContent=`등록 ${arr.length}개${isAdmin?' · 관리자 편집 가능':' · 읽기 전용'}`;
  $('#list').innerHTML=arr.length?arr.map(n=>`<article class="rule-item">
    <button class="rule-open" type="button" onclick="openView('${n.id}')">
      <div class="rule-name">${esc(n.game_name)}</div>
      <div class="rule-hint">눌러서 잔룰 보기</div>
    </button>
    ${isAdmin?`<div class="rule-actions"><button class="rule-edit" type="button" onclick="openEdit('${n.id}')">수정</button><button class="rule-delete" type="button" onclick="deleteNote('${n.id}')">×</button></div>`:''}
  </article>`).join(''):'<div class="empty">등록된 잔룰이 없어요.</div>';
}

function showModal(){ $('#ruleModal').classList.remove('hidden'); }
function closeModal(){
  clearTimeout(saveTimer); editingId=null;
  $('#ruleModal').classList.add('hidden');
  $('#viewMode').classList.add('hidden'); $('#editMode').classList.add('hidden');
  $('#editMode').reset(); $('#noteId').value=''; $('#saveState').textContent='';
}

window.openView=id=>{
  const n=notes.find(x=>x.id===id); if(!n)return;
  $('#modalTitle').textContent=n.game_name;
  $('#viewNote').textContent=n.note?.trim()||'등록된 잔룰 메모가 없어요.';
  $('#viewMode').classList.remove('hidden'); $('#editMode').classList.add('hidden');
  showModal();
};

function openNew(){
  if(!isAdmin)return;
  editingId=null; $('#editMode').reset(); $('#noteId').value='';
  $('#modalTitle').textContent='잔룰 추가'; $('#saveNew').textContent='등록';
  $('#saveState').textContent='';
  $('#viewMode').classList.add('hidden'); $('#editMode').classList.remove('hidden');
  showModal(); setTimeout(()=>$('#gameName').focus(),50);
}

window.openEdit=id=>{
  if(!isAdmin)return;
  const n=notes.find(x=>x.id===id); if(!n)return;
  editingId=id; $('#noteId').value=id; $('#gameName').value=n.game_name||''; $('#gameNote').value=n.note||'';
  $('#modalTitle').textContent='잔룰 수정'; $('#saveNew').textContent='저장'; $('#saveState').textContent='입력하면 자동 저장';
  $('#viewMode').classList.add('hidden'); $('#editMode').classList.remove('hidden');
  showModal();
};

async function createNote(){
  const game_name=$('#gameName').value.trim(), note=$('#gameNote').value;
  if(!game_name)return;
  const {data,error}=await db.from('game_rule_notes').insert({game_name,note,updated_at:new Date().toISOString()}).select().single();
  if(error)return alert(error.code==='23505'?'같은 게임명이 이미 등록되어 있어요.':error.message);
  notes.push(data); closeModal(); draw();
}

function queueEditSave(){
  if(!editingId||!isAdmin)return;
  $('#saveState').textContent='입력 중...';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveEdit,650);
}

async function saveEdit(){
  if(!editingId||!isAdmin)return;
  const game_name=$('#gameName').value.trim(), note=$('#gameNote').value;
  if(!game_name)return;
  $('#saveState').textContent='저장 중...';
  const {data,error}=await db.from('game_rule_notes').update({game_name,note,updated_at:new Date().toISOString()}).eq('id',editingId).select().single();
  if(error){$('#saveState').textContent='저장 실패';return alert(error.code==='23505'?'같은 게임명이 이미 등록되어 있어요.':error.message);}
  const i=notes.findIndex(x=>x.id===editingId); if(i>=0)notes[i]=data;
  $('#saveState').textContent='자동 저장됨'; draw();
  setTimeout(()=>{if($('#saveState').textContent==='자동 저장됨')$('#saveState').textContent='입력하면 자동 저장';},1000);
}

window.deleteNote=async id=>{
  if(!isAdmin||!confirm('이 잔룰 노트를 삭제할까요?'))return;
  const {error}=await db.from('game_rule_notes').delete().eq('id',id);
  if(error)return alert(error.message);
  notes=notes.filter(x=>x.id!==id); if(editingId===id)closeModal(); draw();
};

$('#q').oninput=draw;
$('#addRule').onclick=openNew;
$('#closeModal').onclick=closeModal;
$('#cancelEdit').onclick=closeModal;
$('#editMode').addEventListener('submit',async e=>{e.preventDefault(); if(editingId)await saveEdit(); else await createNote();});
$('#gameName').oninput=queueEditSave; $('#gameNote').oninput=queueEditSave;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ruleModal').classList.contains('hidden'))closeModal();});
init();
</script>
</body>
</html>
