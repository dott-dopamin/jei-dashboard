<main class="wrapper">
 <header class="hero"><div class="eyebrow">BOARDGAME ARCHIVE</div><h1 id="shelfTitle">보드게임 책장</h1><p id="subtitle">이 책장은 누구나 구경할 수 있어요. 수정은 책장 주인만 할 수 있습니다.</p></header>
 <section aria-label="보드게임 목록">
  <div class="game-toolbar"><input id="search" type="search" placeholder="게임명 검색" aria-label="게임명 검색"><select id="genre" aria-label="장르 필터"><option value="">장르 전체</option><option>전략</option><option>파티/패밀리</option><option>추리</option><option>마피아/디덕션</option><option>협력</option><option>기타</option></select><label class="expansion-toggle"><input id="includeExpansions" type="checkbox" checked> 확장 포함</label></div>
  <div class="count" id="count"></div><div id="gameGrid" class="gamegrid"><div class="empty">책장을 불러오는 중...</div></div>
 </section>
 <footer class="footer">개인 보드게임 책장 · 공개 열람 전용</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImage=src=>{src=String(src||'');return /^https:\/\/[^\s"<>]+$/.test(src)||/^data:image\/(?:jpeg|webp|png);base64,[A-Za-z0-9+/=]+$/.test(src)?src:''};
const params=new URLSearchParams(location.search);
const id=params.get('shelf');
let games=[];
function errorView(message){$('#shelfTitle').textContent='책장을 표시할 수 없어요';$('#subtitle').textContent=message;$('#gameGrid').innerHTML='<div class="empty">'+esc(message)+'</div>';$('#count').textContent='';}
function draw(){
 const q=$('#search').value.trim().toLocaleLowerCase('ko-KR'),genre=$('#genre').value,expanded=$('#includeExpansions').checked;
 const coll=new Intl.Collator('ko-KR',{numeric:true,sensitivity:'base'});
 const list=games.filter(g=>(!q||String(g.title||'').toLocaleLowerCase('ko-KR').includes(q))&&(!genre||g.genre===genre)&&(expanded||!g.is_expansion))
 .sort((a,b)=>coll.compare(String(a.title||''),String(b.title||'')));
 const excluded=!expanded?games.filter(g=>g.is_expansion&&(!q||String(g.title||'').toLocaleLowerCase('ko-KR').includes(q))&&(!genre||g.genre===genre)).length:0;
 $('#count').textContent=`총 ${list.length}개 · 가나다순${excluded?` · 확장 ${excluded}개 숨김`:''}`;
 $('#gameGrid').innerHTML=list.length?list.map(g=>{
 const src=safeImage(g.image_url);return `<article class="game-card"><div class="game-image">${src?`<img loading="lazy" decoding="async" src="${esc(src)}" alt="${esc(g.title)}">`:'<span class="no-image">NO IMAGE</span>'}</div>
 <div class="game-info"><div class="game-info-top"><span class="game-genre">${esc(g.genre||'')}</span>${(g.is_expansion||g.is_funding)?`<div class="game-badges">${g.is_expansion?'<span class="game-badge expansion-badge">확장</span>':''}${g.is_funding?'<span class="game-badge funding-badge">펀딩</span>':''}</div>`:''}</div><h3 title="${esc(g.title)}">${esc(g.title)}</h3><div class="game-meta">👥 ${esc(g.player_count||'-')}<br>⏱ ${esc(g.play_time||'-')}</div></div></article>`;}).join(''):'<div class="empty-games">해당 조건의 게임이 없어요.</div>';
}
async function load(){if(!id||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){errorView('유효한 개인 책장 공개 주소가 아니에요.');return;}
try{const db=supabase.createClient('https://yqvjgalmjrydfygtozgo.supabase.co','sb_publishable_8K_sITH95Nkikw8-tdyDwQ_-JFzo94Z');
const [{data:directory,error:dirErr},{data:loaded,error:gameErr}]=await Promise.all([db.rpc('dott_shelf_directory'),db.rpc('dott_shelf_view',{p_shelf_id:id})]);
if(dirErr)throw dirErr;if(gameErr)throw gameErr;
const shelf=(directory||[]).find(s=>String(s.shelf_id).toLowerCase()===id.toLowerCase());if(!shelf){errorView('존재하지 않거나 공개되지 않은 책장이에요.');return;}
games=loaded||[];$('#shelfTitle').textContent=shelf.shelf_name;document.title=shelf.shelf_name+' | DOTT 책장';draw();}
catch(e){console.warn('공개 책장 불러오기 실패',e);errorView('일시적으로 책장을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');}}
$('#search').addEventListener('input',draw);$('#genre').addEventListener('change',draw);$('#includeExpansions').addEventListener('change',draw);load();
})();
</script>
