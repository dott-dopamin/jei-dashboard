<style>
html,body{background:#f7f8f9!important}*{box-sizing:border-box}button,input,select,textarea{font:inherit}
.play-wrap{width:100%;max-width:1560px;margin:0 auto;padding:42px 26px 70px}.play-top{width:100%}.back{text-decoration:none;color:#747c86;font-size:13px;font-weight:700}
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 140px auto;gap:9px;margin:20px 0 12px}.toolbar input,.toolbar select{border:1px solid #dfe2e6;border-radius:10px;background:#fff;padding:12px 13px;font-size:14px;outline:none;color:#252b31}.toolbar input:focus,.toolbar select:focus{border-color:#b9c1c9;box-shadow:0 0 0 3px rgba(77,92,107,.07)}.add-play{border:0;border-radius:10px;background:#28343e;color:#fff;font-weight:800;padding:0 18px;cursor:pointer;white-space:nowrap}.add-play:hover{background:#1f2a32}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 12px}.stat{background:#fff;border:1px solid #e0e4e8;border-radius:13px;padding:13px 14px}.stat-label{font-size:10px;color:#9298a0;font-weight:800;letter-spacing:.04em}.stat-value{font-size:23px;font-weight:850;margin-top:4px;letter-spacing:-.03em}.stat-sub{font-size:10px;color:#9aa0a7;margin-top:3px}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.insight{background:#fff;border:1px solid #e0e4e8;border-radius:14px;padding:14px}.insight-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.insight h2{font-size:14px;margin:0}.insight small{font-size:10px;color:#9aa0a7}.ranking{display:grid;gap:6px}.rank-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;padding:7px 9px;background:#f7f8f9;border-radius:8px;font-size:12px}.rank-num{font-size:10px;color:#9aa0a7;font-weight:800}.rank-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-count{font-size:11px;color:#717983}.unplayed{display:flex;gap:6px;flex-wrap:wrap;max-height:112px;overflow:auto}.unplayed-chip{border:1px solid #e0e4e8;background:#fafbfc;border-radius:999px;padding:6px 9px;font-size:10px;color:#606872}.insight-empty{color:#9aa0a7;font-size:12px;padding:18px 0;text-align:center}
.summary{font-size:12px;color:#8c929a;margin:0 0 12px}.log-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.log-card{position:relative;background:#fff;border:1px solid #e1e4e8;border-radius:14px;padding:14px;min-width:0}.log-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-right:72px}.log-date{font-size:10px;color:#8d949c;font-weight:800;letter-spacing:.04em}.log-title{font-size:17px;font-weight:850;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;background:#eef1f4;color:#66707a}.tag.first{background:#e8f2ee;color:#4c7865}.tag.expansion{background:#fdeaea;color:#a74d4d}.tag.replay{background:#eee9fa;color:#705aa7}.log-meta{font-size:11px;color:#737b84;line-height:1.65;margin-top:9px}.log-memo{margin-top:10px;padding:10px 11px;background:#f7f8f9;border-radius:9px;font-size:12px;line-height:1.55;white-space:pre-wrap;color:#40474e}.log-actions{position:absolute;right:9px;top:9px;display:flex;gap:4px}.edit-btn,.delete-btn{height:28px;border:1px solid #e1e5e9;background:#fff;color:#6a727b;border-radius:14px;font-size:10px;font-weight:800;cursor:pointer}.edit-btn{padding:0 9px}.delete-btn{width:28px;padding:0;font-size:14px}.empty{grid-column:1/-1;text-align:center;color:#9aa0a8;padding:70px 0;font-size:13px}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(24,30,35,.48);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.dialog{display:flex;flex-direction:column;width:min(650px,100%);max-height:calc(100dvh - 36px);overflow:hidden;background:#fff;border:1px solid #dfe4e8;border-radius:18px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.dialog-kicker{font-size:10px;letter-spacing:.14em;font-weight:900;color:#9198a0;margin-bottom:5px}.dialog h2{font-size:22px;margin:0}.close-modal{border:0;width:34px;height:34px;border-radius:50%;background:#f0f2f4;color:#23282d;font-size:20px;cursor:pointer}.dialog-body{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-right:2px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:10px;color:#737c85;font-weight:800}.field input,.field select,.field textarea{border:1px solid #dfe4e8;border-radius:9px;padding:10px 11px;background:#fff;outline:none;color:#20262b}.field textarea{min-height:96px;resize:vertical;line-height:1.5}.checks{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#606871}.checks label{display:flex;align-items:center;gap:6px}.checks input{width:16px;height:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.primary{border:0;border-radius:9px;background:#28343e;color:#fff;font-weight:800;padding:10px 15px;cursor:pointer}.ghost{border:1px solid #dce1e5;border-radius:9px;background:#fff;color:#626a73;font-weight:800;padding:9px 13px;cursor:pointer}.hidden{display:none!important}body.modal-open{overflow:hidden}
@media(max-width:1200px){.log-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.insight-grid{grid-template-columns:1fr}.log-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.play-wrap{padding:28px 10px 50px}.toolbar{grid-template-columns:1fr 105px}.add-play{grid-column:1/-1;height:42px}.stats{gap:6px}.stat{padding:10px}.stat-value{font-size:19px}.insight{padding:11px}.modal-bg{align-items:flex-start;padding:10px}.dialog{padding:16px 14px;border-radius:15px;max-height:calc(100dvh - 20px)}.form-grid{grid-template-columns:1fr}.field.wide,.checks{grid-column:auto}.log-list{grid-template-columns:1fr}.log-card{padding:12px}.log-title{font-size:15px}}
</style>
</head>
<body>
<div class="play-wrap">
  <div class="play-top archive-header">
    <nav class="archive-nav" aria-label="게임 아카이브">
      <span class="archive-kicker">GAME ARCHIVE</span>
      <a class="archive-link" href="games.html">보드게임 책장 <span>📚</span></a><span class="archive-divider">|</span>
      <a class="archive-link active" href="play-log.html">플레이 로그 <span>📅</span></a><span class="archive-divider">|</span>
      <a class="archive-link" href="rules-notes.html">잔룰 노트 <span>📝</span></a><span class="archive-divider">|</span>
      <a class="archive-link" href="pandemic-legacy-s1.html">팬데믹 S1 로그 <span>🔒</span></a>
    </nav>
    <a class="back" href="index.html">← HOME</a>
  </div>

  <div class="toolbar">
    <input id="q" placeholder="게임명 / 같이 한 사람 / 장소 검색">
    <select id="yearFilter"><option value="">전체 연도</option></select>
    <button id="addPlay" class="add-play" type="button" style="display:none">+ 플레이 기록</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">총 플레이</div><div id="statTotal" class="stat-value">0</div><div class="stat-sub">기록된 세션</div></div>
    <div class="stat"><div class="stat-label">플레이한 게임</div><div id="statGames" class="stat-value">0</div><div class="stat-sub">중복 제외</div></div>
    <div class="stat"><div class="stat-label">올해 플레이</div><div id="statYear" class="stat-value">0</div><div class="stat-sub" id="statYearLabel"></div></div>
    <div class="stat"><div class="stat-label">미플 보유게임</div><div id="statUnplayed" class="stat-value">0</div><div class="stat-sub">확장 제외</div></div>
  </div>

  <div class="insight-grid">
    <section class="insight"><div class="insight-head"><h2>올해 많이 한 게임 TOP 5</h2><small id="topYear"></small></div><div id="ranking" class="ranking"></div></section>
    <section class="insight"><div class="insight-head"><h2>아직 플레이 기록 없는 보유게임</h2><small>확장 제외</small></div><div id="unplayed" class="unplayed"></div></section>
  </div>

  <div id="summary" class="summary"></div>
  <div id="logList" class="log-list"></div>
</div>

<div id="playModal" class="modal-bg hidden">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog-head"><div><div class="dialog-kicker">PLAY LOG</div><h2 id="dialogTitle">플레이 기록 추가</h2></div><button id="closeModal" class="close-modal" type="button" aria-label="닫기">×</button></div>
    <div class="dialog-body">
      <form id="playForm" class="form-grid">
        <input id="logId" type="hidden">
        <div class="field wide"><label>게임명</label><input id="gameTitle" list="gameOptions" required placeholder="보유게임 이름 입력 또는 선택"><datalist id="gameOptions"></datalist></div>
        <div class="field"><label>플레이 날짜</label><input id="playedOn" type="date" required></div>
        <div class="field"><label>인원</label><input id="playerCount" type="number" min="1" max="30" placeholder="예: 4"></div>
        <div class="field wide"><label>같이 한 사람</label><input id="players" placeholder="예: 제이, 우리, 승연, 종우"></div>
        <div class="field"><label>장소</label><input id="place" placeholder="예: 도트"></div>
        <div class="field"><label>결과 / 점수</label><input id="result" placeholder="예: 승리 / 83점"></div>
        <div class="field wide"><label>재플레이 느낌</label><select id="replayTag"><option value="">선택 안 함</option><option>최애</option><option>또 할래</option><option>무난</option><option>방출 고민</option></select></div>
        <div class="field wide"><label>한줄평 / 다음에 기억할 것</label><textarea id="memo" placeholder="3인은 템포 좋음. 다음엔 확장 넣어보기."></textarea></div>
        <div class="checks"><label><input id="firstPlay" type="checkbox"> 첫 플레이</label><label><input id="usedExpansion" type="checkbox"> 확장 사용</label></div>
      </form>
    </div>
    <div class="dialog-actions"><button id="cancelModal" class="ghost" type="button">취소</button><button id="savePlay" class="primary" type="button">저장</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://yqvjgalmjrydfygtozgo.supabase.co','sb_publishable_8K_sITH95Nkikw8-tdyDwQ_-JFzo94Z');
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coll=new Intl.Collator('ko-KR',{numeric:true,sensitivity:'base'});let logs=[],games=[],isAdmin=false,scrollY=0;
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(v){if(!v)return '-';const [y,m,d]=v.split('-');return `${y}.${m}.${d}`}
function norm(s){return String(s||'').trim().toLocaleLowerCase('ko-KR')}
async function init(){
  const [{data:{session}},{data:gameData,error:gameErr},{data:logData,error:logErr}]=await Promise.all([db.auth.getSession(),db.from('board_games').select('id,title,is_expansion'),db.from('board_game_play_logs').select('*').order('played_on',{ascending:false}).order('created_at',{ascending:false})]);
  isAdmin=!!session;$('#addPlay').style.display=isAdmin?'':'none';
  if(gameErr)return alert(gameErr.message);if(logErr)return alert(logErr.message);
  games=(gameData||[]).sort((a,b)=>coll.compare(a.title||'',b.title||''));logs=logData||[];
  $('#gameOptions').innerHTML=games.map(g=>`<option value="${esc(g.title)}"></option>`).join('');buildYears();draw();
}
function buildYears(){const ys=[...new Set(logs.map(x=>(x.played_on||'').slice(0,4)).filter(Boolean))].sort((a,b)=>b.localeCompare(a));$('#yearFilter').innerHTML='<option value="">전체 연도</option>'+ys.map(y=>`<option>${y}</option>`).join('')}
function filtered(){const q=$('#q').value.trim().toLowerCase(),y=$('#yearFilter').value;return logs.filter(x=>(!y||(x.played_on||'').startsWith(y))&&(!q||[x.game_title,x.players,x.place,x.memo].some(v=>String(v||'').toLowerCase().includes(q))))}
function draw(){const arr=filtered();const nowYear=String(new Date().getFullYear());
  const playedKeys=new Set(logs.map(x=>x.game_id?`id:${x.game_id}`:`name:${norm(x.game_title)}`));const baseGames=games.filter(g=>!g.is_expansion);const unplayed=baseGames.filter(g=>!playedKeys.has(`id:${g.id}`)&&!playedKeys.has(`name:${norm(g.title)}`));
  $('#statTotal').textContent=logs.length;$('#statGames').textContent=new Set(logs.map(x=>norm(x.game_title)).filter(Boolean)).size;$('#statYear').textContent=logs.filter(x=>(x.played_on||'').startsWith(nowYear)).length;$('#statYearLabel').textContent=`${nowYear}년`;$('#statUnplayed').textContent=unplayed.length;
  const counts={};logs.filter(x=>(x.played_on||'').startsWith(nowYear)).forEach(x=>counts[x.game_title]=(counts[x.game_title]||0)+1);const rank=Object.entries(counts).sort((a,b)=>b[1]-a[1]||coll.compare(a[0],b[0])).slice(0,5);$('#topYear').textContent=`${nowYear}년`;$('#ranking').innerHTML=rank.length?rank.map(([n,c],i)=>`<div class="rank-row"><span class="rank-num">${i+1}</span><span class="rank-name">${esc(n)}</span><span class="rank-count">${c}회</span></div>`).join(''):'<div class="insight-empty">아직 올해 플레이 기록이 없어요.</div>';
  $('#unplayed').innerHTML=unplayed.length?unplayed.slice(0,40).map(g=>`<span class="unplayed-chip">${esc(g.title)}</span>`).join(''):'<div class="insight-empty">미플 게임 없음 🎉</div>';
  $('#summary').textContent=`총 ${arr.length}개 기록 · 최신순${isAdmin?' · 관리자 편집 가능':' · 읽기 전용'}`;
  $('#logList').innerHTML=arr.length?arr.map(x=>`<article class="log-card">${isAdmin?`<div class="log-actions"><button class="edit-btn" onclick="openEdit('${x.id}')">수정</button><button class="delete-btn" onclick="deleteLog('${x.id}')">×</button></div>`:''}<div class="log-head"><div><div class="log-date">${formatDate(x.played_on)}</div><div class="log-title">${esc(x.game_title)}</div></div></div><div class="tag-row">${x.replay_tag?`<span class="tag replay">${esc(x.replay_tag)}</span>`:''}${x.is_first_play?'<span class="tag first">첫 플레이</span>':''}${x.used_expansion?'<span class="tag expansion">확장 사용</span>':''}</div><div class="log-meta">${x.players?`👥 ${esc(x.players)}${x.player_count?` · ${x.player_count}인`:''}`:(x.player_count?`👥 ${x.player_count}인`:'')}${x.place?`<br>📍 ${esc(x.place)}`:''}${x.result?`<br>🏁 ${esc(x.result)}`:''}</div>${x.memo?`<div class="log-memo">${esc(x.memo)}</div>`:''}</article>`).join(''):'<div class="empty">조건에 맞는 플레이 기록이 없어요.</div>';
}
function lock(){scrollY=window.scrollY||0;document.body.classList.add('modal-open');document.body.style.position='fixed';document.body.style.top=`-${scrollY}px`;document.body.style.left='0';document.body.style.right='0';document.body.style.width='100%'}function unlock(){document.body.classList.remove('modal-open');document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';document.body.style.width='';window.scrollTo(0,scrollY)}
function openModal(){ $('#playModal').classList.remove('hidden');lock()}function closeModal(){ $('#playModal').classList.add('hidden');unlock();$('#playForm').reset();$('#logId').value=''}
function selectedGame(){const name=$('#gameTitle').value.trim();return games.find(g=>norm(g.title)===norm(name))||null}
function inferFirst(){const g=selectedGame(),title=$('#gameTitle').value.trim();if(!title)return;$('#firstPlay').checked=!logs.some(x=>(g&&x.game_id===g.id)||norm(x.game_title)===norm(title))}
function openNew(){if(!isAdmin)return;$('#playForm').reset();$('#logId').value='';$('#dialogTitle').textContent='플레이 기록 추가';$('#playedOn').value=today();openModal();setTimeout(()=>$('#gameTitle').focus(),50)}
window.openEdit=id=>{if(!isAdmin)return;const x=logs.find(v=>v.id===id);if(!x)return;$('#logId').value=x.id;$('#gameTitle').value=x.game_title||'';$('#playedOn').value=x.played_on||today();$('#players').value=x.players||'';$('#playerCount').value=x.player_count||'';$('#place').value=x.place||'';$('#result').value=x.result||'';$('#replayTag').value=x.replay_tag||'';$('#memo').value=x.memo||'';$('#firstPlay').checked=!!x.is_first_play;$('#usedExpansion').checked=!!x.used_expansion;$('#dialogTitle').textContent='플레이 기록 수정';openModal()};
window.deleteLog=async id=>{if(!isAdmin||!confirm('이 플레이 기록을 삭제할까요?'))return;const {error}=await db.from('board_game_play_logs').delete().eq('id',id);if(error)return alert(error.message);logs=logs.filter(x=>x.id!==id);buildYears();draw()};
async function save(){if(!isAdmin)return;const title=$('#gameTitle').value.trim();if(!title)return alert('게임명을 입력해줘.');const g=selectedGame();const row={game_id:g?.id||null,game_title:title,played_on:$('#playedOn').value||today(),players:$('#players').value.trim(),player_count:$('#playerCount').value?Number($('#playerCount').value):null,place:$('#place').value.trim(),result:$('#result').value.trim(),replay_tag:$('#replayTag').value,memo:$('#memo').value.trim(),is_first_play:$('#firstPlay').checked,used_expansion:$('#usedExpansion').checked,updated_at:new Date().toISOString()};const id=$('#logId').value;let data,error;if(id)({data,error}=await db.from('board_game_play_logs').update(row).eq('id',id).select().single());else({data,error}=await db.from('board_game_play_logs').insert(row).select().single());if(error)return alert(error.message);if(id){const i=logs.findIndex(x=>x.id===id);if(i>=0)logs[i]=data}else logs.push(data);logs.sort((a,b)=>(b.played_on||'').localeCompare(a.played_on||'')||String(b.created_at||'').localeCompare(String(a.created_at||'')));closeModal();buildYears();draw()}
$('#q').oninput=draw;$('#yearFilter').onchange=draw;$('#addPlay').onclick=openNew;$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#savePlay').onclick=save;$('#gameTitle').onchange=inferFirst;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#playModal').classList.contains('hidden'))closeModal()});init();
</script>
</body>
</html>
